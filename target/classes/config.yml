# Настройки плагина Жопа Слона
# Создатель: GalyaKyxnya

# Шанс выпадения части из руд (в процентах)
drop-chance: 3.0

# Настройки босса
boss:
  name: "Хозяин Жопы"
  max-health: 250.0
  scale: 3.0
  damage-reflection: 0.3  # 30% урона отражается на атакующего
  attack-damage: 2.0     # Урон, который наносит босс (базовый)
  
  # НАСТРОЙКИ АТАК
  melee-damage: 10.0     # Урон ближней атаки
  melee-cooldown: 1.5    # КД ближней атаки (секунды)
  ranged-cooldown: 3.0   # КД дальней атаки (секунды)
  fireball-power: 1.5    # Мощность фаербола
  berserk-attack-multiplier: 1.5  # Умножение скорости атак в режиме берсерка

# Привязка частей к рудам (для справки)
part-sources:
  coal-ore: Ухо слона
  iron-ore: Шкура слона  
  gold-ore: Кость слона
  copper-ore: Нога слона
  emerald-ore: Хобот слона
  diamond-ore: Жопа слона
  
# LuckPerms группа для награды
reward-group: "architect"
  
# Сообщения
messages:
  need-parts: "§c§lСобери все 6 частей слона!"
  parts-info: "§eКуски падают из разных руд с шансом 3%."
  parts-list: "§6Части выпадают из: угля, железа, золота, меди, изумрудов, алмазов."
  summoning: "§a§l✓ Все части собраны! Призываю Хозяина Жопы..."
  boss-warning: "§c§l⚠ Приготовься к битве! Хозяин Жопы появился рядом!"
  boss-spawned: "§4§lВНИМАНИЕ! §cХозяин Жопы появился на координатах X:%x% Y:%y% Z:%z%"

# Награда за убийство босса
rewards:
  exp-levels: 20
  luckperms-group: "architect"
  broadcast-message: "§6§l🎉 %player% победил Хозяина Жопы и получил группу %group%!"

# Система отражения урона босса
damage-reflection:
  enabled: true
  percent: 0.3  # 30% урона отражается на атакующего
  reduction: 0.2  # 20% снижение получаемого боссом урона
  message: "§cБосс отражает %percent%% вашего урона!"
  
# Защита от определённых типов урона
damage-protection:
  fall: 0.5      # Урон от падения (50%)
  fire: 0.3      # Урон от огня (30%)
  projectile: 1.0 # Урон от стрел (100%)
  
# Административные настройки
admin:
  max-parts-per-give: 64  # Максимальное количество частей за раз
  notify-on-give: true    # Уведомлять игрока при выдаче

# Режим берсерка (усиление при 50% HP)
berserk-mode:
  enabled: true
  health-threshold: 50  # Процент HP для активации
  damage-multiplier: 2.0  # Во сколько раз увеличивается урон
  strength-effect-level: 1  # Уровень эффекта Strength (1 = +130%)
  message: "§4§l⚠ ХОЗЯИН ЖОПЫ ВПАЛ В ЯРОСТЬ! СТАЛ БЫСТРЕЕ И СИЛЬНЕЕ!"
  particles: true